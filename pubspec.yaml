name: health_tracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  camera: ^0.11.1
  image_picker: ^1.2.1
  http: ^1.6.0
  mime: ^2.0.0
  geolocator: ^14.0.2
  sensors_plus: ^5.0.1
  shared_preferences: ^2.5.5
  workmanager: ^0.7.0
  google_fonts: ^8.0.2
  google_sign_in: ^7.2.0
  pedometer: ^4.1.1
  google_generative_ai: ^0.4.0 # Added for AI features

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
